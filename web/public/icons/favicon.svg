<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="p2p-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#090d16" />
  <!-- P2P Connected Circles -->
  <circle cx="34" cy="50" r="18" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.8"/>
  <circle cx="66" cy="50" r="18" stroke="#8b5cf6" stroke-width="3" stroke-opacity="0.8"/>
  <circle cx="34" cy="50" r="7" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="66" cy="50" r="7" fill="#8b5cf6" filter="url(#glow)"/>
  <!-- Direct Link Wave -->
  <path d="M42 50 L58 50" stroke="#ffffff" stroke-width="3" stroke-dasharray="2 3" stroke-linecap="round"/>
</svg>
